name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mc1_7_10:
    name: Minecraft 1.7.10 (Forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # the last one is the default JAVA_HOME
          java-version: |
            8
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: mc1.7.10
        env:
          # the GTNH buildscript takes its version from git tags unless VERSION is set
          VERSION: 0.0.0-ci.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace -x spotlessCheck

      - uses: actions/upload-artifact@v4
        with:
          name: inventorytodo-mc1.7.10
          path: |
            mc1.7.10/build/libs/*.jar
            !mc1.7.10/build/libs/*-dev.jar
            !mc1.7.10/build/libs/*-sources.jar
          if-no-files-found: error

  modern:
    name: Modern versions (Forge / Fabric / NeoForge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect modern project
        id: detect
        run: |
          if [ -f modern/gradlew ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "modern/ not found, skipping"; fi

      - uses: actions/setup-java@v4
        if: steps.detect.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.detect.outputs.present == 'true'

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: modern
        env:
          MOD_VERSION: 0.0.0-ci.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -f ci-build.sh ]; then
            bash ci-build.sh
          else
            ./gradlew build --no-daemon --stacktrace -Pmod_version="$MOD_VERSION"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.present == 'true'
        with:
          name: inventorytodo-modern
          path: |
            modern/**/build/libs/inventorytodo-*.jar
            !modern/**/build/libs/*-dev*.jar
            !modern/**/build/libs/*-sources.jar
          if-no-files-found: warn
