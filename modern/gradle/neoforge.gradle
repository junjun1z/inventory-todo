apply plugin: 'net.neoforged.moddev'
apply from: rootProject.file('gradle/common.gradle')

neoForge {
    version = project.property('neoforge_version')
    runs {
        client { client() }
    }
    mods {
        inventorytodo { sourceSet sourceSets.main }
    }
}

dependencies {
    def extra = rootProject.file("gradle/deps-neoforge-${project.property('code_version')}.gradle")
    if (extra.exists()) apply from: extra, to: project
}
