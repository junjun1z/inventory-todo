pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Downloads missing JDKs (17 / 21 / 25) automatically for the Java toolchains
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'inventorytodo-modern'

// Every build target: <minecraft version>-<loader>. Each has targets/<name>/gradle.properties.
def targets = file('targets').listFiles().findAll { it.isDirectory() && new File(it, 'gradle.properties').exists() }
        .collect { it.name }.sort()
// -Ptargets=1.20.1-fabric,26.3-neoforge builds only these
def only = providers.gradleProperty('targets').orNull
if (only) targets = targets.findAll { only.split(',').contains(it) }
targets.each { t ->
    include(":$t")
    project(":$t").projectDir = file("targets/$t")
    project(":$t").buildFileName = '../../gradle/target.gradle'
}

// MinecraftForge before 1.17 (Architectury Loom) lives in a nested build with its own plugin classpath
includeBuild('legacy')
